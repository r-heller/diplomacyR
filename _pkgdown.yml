url: https://r-heller.github.io/diplomacyR/

template:
  bootstrap: 5
  bslib:
    primary: "#5E2C8E"
    link-color: "#5E2C8E"

reference:
- title: Classes
  desc: The six S3 objects the package is built from.
  contents:
  - dp_game
  - dp_map-class
  - dp_orders
  - dp_result
  - dp_history-class
  - dp_sim
- title: Setup
  desc: The board, the units and a game to play on it.
  contents:
  - dp_map
  - dp_provinces
  - dp_adjacent
  - dp_home_centres
  - dp_new_game
  - dp_game_from_units
  - dp_units
  - dp_unit
  - dp_example_game
- title: Orders
  desc: Writing, parsing and enumerating orders.
  contents:
  - dp_order
  - dp_parse_orders
  - dp_bind_orders
  - dp_legal_orders
  - dp_example_orders
  - format.dp_orders
- title: Engine
  desc: Adjudicating a phase and stepping the game forward.
  contents:
  - dp_adjudicate
  - dp_retreat
  - dp_build
  - dp_advance
  - dp_step
  - dp_play
- title: AI
  desc: Scriptable bots.
  contents:
  - dp_ai_orders
  - dp_ai_all
- title: Simulation
  desc: Playing many games and summarising them.
  contents:
  - dp_simulate
  - dp_stats
- title: Analysis
  desc: Supply centres, victory conditions and per-power summaries.
  contents:
  - dp_supply_centres
  - dp_power_counts
  - dp_power_summary
  - dp_victory_check
  - dp_sc_trajectory
  - dp_history
  - dp_history_append
- title: Plot
  desc: Every renderer returns a ggplot2 object.
  contents:
  - dp_plot_map
  - dp_plot_sc_history
  - dp_plot_winrates
  - dp_plot_centres
  - dp_plot_supply_heatmap
  - dp_palette
  - autoplot.dp_game
- title: App
  contents:
  - dp_run_app
- title: Class predicates and coercion
  contents:
  - is_dp_map
  - is_dp_game
  - is_dp_orders
  - is_dp_result
  - is_dp_history
  - is_dp_sim
  - as_tibble.dp_history
  - as_tibble.dp_orders
  - length.dp_history
  - reexports

articles:
- title: Articles
  navbar: ~
  contents:
  - diplomacyR
  - adjudication
  - notation
  - ai-and-simulation
  - design
